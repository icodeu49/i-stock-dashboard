name: Automated Daily Watchlist Scanner

on:
  schedule:
    - cron: '18 13,21 * * 1-5'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  run-scanner:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: watchlist-state-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-automation.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-automation.txt
      - name: Refresh momentum candidates
        id: momentum
        run: python heatmap_skimmer.py
      - name: Send stock alerts and coverage report
        if: success() || steps.momentum.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notifier.py
      - name: Persist watchlist and confirmed deliveries
        if: always()
        run: bash scripts/persist_state.sh

