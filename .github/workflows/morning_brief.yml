name: Daily Morning News Agent

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: morning-email-main
  cancel-in-progress: false

jobs:
  run-agent:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: watchlist-state-main
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-automation.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-automation.txt
      - name: Send morning briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: python news_agent.py

      - name: Save email preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-briefing-preview
          path: reports/latest_briefing.html
          retention-days: 14
          if-no-files-found: ignore
      - name: Persist confirmed briefing state
        if: always()
        run: bash scripts/persist_state.sh
