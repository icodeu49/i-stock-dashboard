name: Daily Morning News Agent

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: morning-email-main
  cancel-in-progress: false

jobs:
  run-agent:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-automation.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-automation.txt
      - name: Send morning briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: python news_agent.py

