name: Validate and refresh automations

on:
  push:
    branches: [main]
    paths: ['**.py', 'tests/**', 'requirements*.txt', '.github/workflows/**', 'scripts/**']
  pull_request:
    paths: ['**.py', 'tests/**', 'requirements*.txt', '.github/workflows/**', 'scripts/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Syntax and regression checks
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
      - name: Import application dependencies
        run: python -c "import streamlit, vectorbt, market_data, notifier, news_agent"
  sectors:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: tests
    permissions:
      contents: write
    uses: ./.github/workflows/sector_scan.yaml
    secrets: inherit
  stocks:
    if: always() && needs.tests.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [tests, sectors]
    permissions:
      contents: write
    uses: ./.github/workflows/auto_skimmer.yml
    secrets: inherit
  comparison:
    if: always() && needs.tests.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [tests, stocks]
    permissions:
      contents: write
    uses: ./.github/workflows/strategy_comparison.yml
  email:
    if: always() && needs.tests.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [tests, stocks, comparison]
    permissions:
      contents: write
    uses: ./.github/workflows/morning_brief.yml
    secrets: inherit
